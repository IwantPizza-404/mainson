name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maison
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://maison:maison@localhost:5432/maison
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps config
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
